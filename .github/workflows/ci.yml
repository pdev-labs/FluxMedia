name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint bandit
          pip install -e .
      - name: Ruff Check
        run: ruff check src/
      - name: Bandit Security Scan
        run: bandit -r src/ -ll -ii

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile check
        run: python -m compileall -q src install.py
      - name: Unit tests
        run: |
          python test_plugins.py
          python test_bootstrap.py
          python test_update_interval.py
          python test_logging.py
          python test_doctor.py
          python test_share.py
          python test_duplicates.py
          python test_search.py
          python test_playlist.py
          python test_notify.py

  termux-pins:
    # No Termux runners exist: instead, verify weekly-relevant facts —
    # every pinned pydantic's exact core has Android wheels for its Pythons.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify Termux wheel coverage for pins
        run: |
          python - <<'EOF'
          import re, urllib.request

          # must match TERMUX_PYDANTIC_PINS + index reality in install.sh/install.py
          pins = {(11, "pydantic==2.13.3", "2.46.3", ("cp311",)),
                  (12, "pydantic==2.13.3", "2.46.3", ("cp312",)),
                  (13, "pydantic==2.13.3", "2.46.3", ("cp313",)),
                  (14, "pydantic==2.12.4", "2.41.5", ("cp314",))}
          index = urllib.request.urlopen(
              "https://termux-user-repository.github.io/pypi/pydantic-core/",
              timeout=60).read().decode()
          index += urllib.request.urlopen(
              "https://eutalix.github.io/android-pydantic-core/pydantic-core/",
              timeout=60).read().decode()
          have = set(re.findall(r"pydantic_core-([0-9.]+)-(cp3\d+)-[a-z0-9_]+-([a-z0-9_]+)\.whl", index))
          errors = []
          for minor, pin, core, tags in sorted(pins):
              for tag in tags:
                  arches = {a for (c, t, a) in have if c == core and t == tag}
                  arm = {a for a in arches if "arm" in a or "aarch64" in a}
                  if not arm:
                      errors.append(f"py3.{minor}: {pin} needs core {core} ARM wheel for {tag} — MISSING (have: {sorted(arches) or 'none'})")
          # each pinned pydantic must require exactly the listed core
          import json
          for minor, pin, core, tags in sorted(pins):
              ver = pin.split("==")[1]
              meta = json.load(urllib.request.urlopen(
                  f"https://pypi.org/pypi/pydantic/{ver}/json", timeout=60))
              reqs = [r for r in meta["info"]["requires_dist"] if "pydantic-core" in r]
              if reqs != [f"pydantic-core=={core}"]:
                  errors.append(f"{pin} requires {reqs}, expected core=={core}")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("Termux pins valid: all pinned cores have Android wheels")
          EOF

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          cd web
          npm ci
      - name: TypeScript Check
        run: |
          cd web
          npm run build
