[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmedia"
version = "1.8.0"
description = "A powerful, cross-platform media portal and processing toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "yt-dlp>=2025.2.18",
    "textual>=0.50.0",
    "mutagen>=1.47.0",
    "instaloader>=4.11.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "curl_cffi>=0.7.4",
    "quickjs>=1.19.2",
]

[project.urls]
Homepage = "https://github.com/pdev-labs/FluxMedia"

[project.scripts]
fluxmedia = "fluxmedia.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"fluxmedia" = ["web_build/**/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F405", "F403", "E402", "E701", "F401", "F841", "F811"]
