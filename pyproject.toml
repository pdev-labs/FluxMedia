[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmedia"
version = "1.18.1"
description = "A powerful, cross-platform media portal and processing toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "yt-dlp>=2025.2.18",
    "textual>=0.50.0",
    "mutagen>=1.47.0",
    "instaloader>=4.11.0",
    # NOTE: fastapi/uvicorn are intentionally NOT hard dependencies.
    # fastapi pulls pydantic -> pydantic-core, a Rust extension with no
    # Android/Termux wheels on PyPI. Making it required means a plain
    # `pip install fluxmedia` on Termux tries to compile pydantic-core and
    # fails. The CLI/TUI work without it; `fluxmedia --web` installs the
    # web stack on first launch via fluxmedia.utils.ensure_web_deps().
    # Desktop installers opt in with the `[web]` extra below.
    # NOTE: quickjs and curl_cffi are intentionally NOT hard dependencies.
    # Both are pure optimizations for yt-dlp (JS challenges, TLS
    # impersonation) with no Windows/Termux wheels, and neither is imported
    # by FluxMedia itself. yt-dlp falls back to Node.js (installed by our
    # installers on every platform). Opt in via extras below.
]

[project.optional-dependencies]
# Web UI: pip install "fluxmedia[web]"
web = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
# YouTube JS-challenge support without Node.js: pip install "fluxmedia[js]"
js = ["quickjs>=1.19.2"]
# TLS impersonation for anti-bot protection: pip install "fluxmedia[impersonate]"
impersonate = ["curl_cffi>=0.7.4"]

[project.urls]
Homepage = "https://github.com/pdev-labs/FluxMedia"
Android = "https://github.com/pdev-labs/Fluxmedia-Android"
"Android Releases" = "https://github.com/pdev-labs/Fluxmedia-Android/releases"
Issues = "https://github.com/pdev-labs/FluxMedia/issues"

[project.scripts]
fluxmedia = "fluxmedia.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"fluxmedia" = ["web_build/**/*"]
"fluxmedia.server" = ["portal.html"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F405", "F403", "E402", "E701", "F401", "F841", "F811"]
