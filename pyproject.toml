[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmedia"
version = "1.11.0"
description = "A powerful, cross-platform media portal and processing toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "yt-dlp>=2025.2.18",
    "textual>=0.50.0",
    "mutagen>=1.47.0",
    "instaloader>=4.11.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "curl_cffi>=0.7.4",
    # NOTE: quickjs intentionally NOT a hard dependency.
    # The `quickjs` PyPI package ships no Windows wheels and requires
    # "Microsoft Visual C++ 14.0 or greater" to build from source, which
    # breaks `pip install fluxmedia` on Windows.
    # yt-dlp does not import quickjs directly — it auto-detects any available
    # JS runtime (Deno / Node / Bun / QuickJS) for YouTube signature/n-token
    # challenges. Node.js (installed by install.ps1/install.sh/install.py)
    # already covers Windows, so keep quickjs optional.
    "quickjs>=1.19.2; sys_platform!='win32'",
]

[project.optional-dependencies]
# Full YouTube JS-challenge support on Linux/macOS, or on Windows if the
# user has C++ Build Tools installed: pip install "fluxmedia[js]"
js = ["quickjs>=1.19.2"]

[project.urls]
Homepage = "https://github.com/pdev-labs/FluxMedia"

[project.scripts]
fluxmedia = "fluxmedia.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"fluxmedia" = ["web_build/**/*"]
"fluxmedia.server" = ["portal.html"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F405", "F403", "E402", "E701", "F401", "F841", "F811"]
